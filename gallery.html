<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギャラリー | 宝石箱の勉強室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0a5c45;
  --green-deep:#063d2e;
  --green-pale:#e6f0eb;
  --gold:#c9a45c;
  --ivory:#f8faf7;
  --ink:#10251d;
  --font:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--ivory);color:var(--ink);line-height:1.9;font-size:16px}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}

/* header */
header{background:var(--green-deep);color:var(--ivory);border-bottom:2px solid var(--gold)}
header .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 24px;padding-top:14px;padding-bottom:14px}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:.12em;text-decoration:none}
nav ul{display:flex;gap:22px;list-style:none;flex-wrap:wrap}
nav a{text-decoration:none;font-size:.95rem;padding:2px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:var(--gold)}

/* page title */
.page-head{background:linear-gradient(160deg,var(--green) 0%,var(--green-deep) 100%);color:var(--ivory);padding:44px 0 48px}
.page-head h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;letter-spacing:.08em}
.page-head p{margin-top:8px;opacity:.92}

main{padding:40px 0 64px}

/* filter */
.filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.filter button{font-family:var(--font);font-size:.95rem;padding:7px 22px;background:var(--ivory);color:var(--green);border:1px solid var(--green);cursor:pointer;letter-spacing:.08em}
.filter button:hover{background:var(--green-pale)}
.filter button[aria-pressed="true"]{background:var(--green);color:var(--ivory)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.item{background:#fff;border:1px solid #cfdfd7;padding:12px}
.item[hidden]{display:none}
.frame{aspect-ratio:3/4;background:var(--green-pale);border:1px dashed var(--green);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:.9rem;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.item figcaption{margin-top:10px;font-size:.95rem}
.item .tag{display:inline-block;margin-right:8px;padding:0 10px;font-size:.78rem;color:var(--green-deep);background:var(--gold)}

footer{background:var(--green-deep);color:var(--ivory);text-align:center;padding:28px 0;font-size:.88rem;border-top:2px solid var(--gold)}

@media (max-width:760px){
  .page-head{padding:32px 0 36px}
  main{padding:24px 0 48px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
}
@media (max-width:420px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">宝石箱の勉強室</a>
    <nav aria-label="メインメニュー">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="blog.html">ブログ</a></li>
        <li><a href="gallery.html" aria-current="page">ギャラリー</a></li>
        <li><a href="about.html">このサイトについて</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="page-head">
  <div class="wrap">
    <h1>ギャラリー</h1>
    <p>ジュエリーをモチーフにした漫画やイラストを展示しています。</p>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="filter" role="group" aria-label="作品の絞り込み">
      <button type="button" data-filter="all" aria-pressed="true">すべて</button>
      <button type="button" data-filter="illust" aria-pressed="false">イラスト</button>
      <button type="button" data-filter="manga" aria-pressed="false">漫画</button>
    </div>

    <!--
      作品の追加方法：
      <div class="frame">…</div> の中身を <img src="画像のパス" alt="作品の説明"> に置き換え、
      figcaption のタイトルを書き換えてください。
      data-type は illust（イラスト）か manga（漫画）です。
    -->
    <div class="grid">
      <figure class="item" data-type="illust">
        <div class="frame">イラスト 1</div>
        <figcaption><span class="tag">イラスト</span>作品タイトル</figcaption>
      </figure>
      <figure class="item" data-type="illust">
        <div class="frame">イラスト 2</div>
        <figcaption><span class="tag">イラスト</span>作品タイトル</figcaption>
      </figure>
      <figure class="item" data-type="manga">
        <div class="frame">漫画 1</div>
        <figcaption><span class="tag">漫画</span>作品タイトル</figcaption>
      </figure>
      <figure class="item" data-type="illust">
        <div class="frame">イラスト 3</div>
        <figcaption><span class="tag">イラスト</span>作品タイトル</figcaption>
      </figure>
      <figure class="item" data-type="manga">
        <div class="frame">漫画 2</div>
        <figcaption><span class="tag">漫画</span>作品タイトル</figcaption>
      </figure>
      <figure class="item" data-type="illust">
        <div class="frame">イラスト 4</div>
        <figcaption><span class="tag">イラスト</span>作品タイトル</figcaption>
      </figure>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">&copy; 2026 宝石箱の勉強室</div>
</footer>

<script>
(function(){
  var buttons = document.querySelectorAll('.filter button');
  var items = document.querySelectorAll('.item');
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var f = btn.getAttribute('data-filter');
      buttons.forEach(function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      items.forEach(function(it){
        it.hidden = !(f === 'all' || it.getAttribute('data-type') === f);
      });
    });
  });
})();
</script>

</body>
</html>
